<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot tekshiruvi / CAPTCHA</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Iltimos, odam ekanligingizni tasdiqlang</h3>
        <p>Please verify that you are a human.</p>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFpTdSdohCCNHVXH" data-callback="onSuccess"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function onSuccess(token) {
            const userId = tg.initDataUnsafe?.user?.id;
            
            fetch('/verify-captcha', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, user_id: userId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    tg.close();
                } else {
                    alert('Xatolik yuz berdi. Qaytadan urinib ko\'ring.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
